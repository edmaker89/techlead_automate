[project]
name = "teachlead-backend"
version = "0.1.0"
description = "TeachLead backend scaffold"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.1",
  "fastapi>=0.115.6",
  "pydantic-settings>=2.7.1",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "ruff>=0.9.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teachlead"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
