services:
  db:
    image: postgres:16-alpine
    container_name: teachlead-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teachlead_net

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: teachlead-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - ./.env:/.env:ro
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn teachlead.main:create_app --factory --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teachlead_net

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: teachlead-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: pnpm dev --host 0.0.0.0 --port 5173
    networks:
      - teachlead_net

volumes:
  postgres_data:

networks:
  teachlead_net:
    driver: bridge
